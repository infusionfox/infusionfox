[project]
name = "infusionfox"
version = "0.1.0"
description = "Veterinary clinical reference and calculator suite"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests that need the full app",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "alembic/versions",
    ".venv",
    "data",
]

[tool.ruff.lint]
# Reasonable defaults — pyflakes, pycodestyle errors, isort, bugbear, simplify, comprehensions
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles this
    "B008",  # function call in default argument — FastAPI uses this idiomatically
    "SIM108", # ternary if-else — sometimes if/else is more readable
    "UP042",  # str + Enum → StrEnum: stylistic only, would touch every enum class
]

[tool.ruff.lint.per-file-ignores]
# Clinical text uses unicode operators (×, µ, ≤, ≥, →, –) deliberately
# in dose calculations and ranges. RUF001/002/003 flag these as "ambiguous"
# but we want to keep them because they're the clinically-correct rendering.
# Same applies to test docstrings.
"app/*" = ["RUF001", "RUF002", "RUF003"]
"tests/*" = ["B011", "RUF001", "RUF002", "RUF003"]
"app/calculators/drugs.py" = ["E501"]  # long descriptive strings are deliberate

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "alembic/",
    "scripts/",
]

# Older calculator engine — keep functional but don't gate merges on
# perfect typing. Math is verified via test suite.
[[tool.mypy.overrides]]
module = [
    "app.calculators.engine",
    "app.calculators.drugs",
    "app.calculators.utilities",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
