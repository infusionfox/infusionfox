<div class="header-search" data-search-widget>
    <form action="/search" method="get" class="header-search__form" role="search" aria-label="Site search">
        <svg class="header-search__icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="7" cy="7" r="5"></circle>
            <line x1="11" y1="11" x2="14" y2="14"></line>
        </svg>
        <input
            type="search"
            name="q"
            placeholder="Search…"
            autocomplete="off"
            spellcheck="false"
            class="header-search__input"
            aria-label="Search InfusionFox"
            aria-controls="search-dropdown"
            aria-expanded="false"
            data-search-input
            hx-get="/search/dropdown"
            hx-trigger="keyup changed delay:150ms, focus delay:100ms"
            hx-target="#search-dropdown"
            hx-swap="innerHTML"
            hx-include="[data-search-input]"
        >
        <kbd class="header-search__shortcut" aria-hidden="true">/</kbd>
    </form>
    <div id="search-dropdown" class="search-dropdown" role="listbox" data-search-dropdown hidden></div>
</div>
